[build]
  publish = "."

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[redirects]]
  from = "/blog/"
  to = "/blog.html"
  status = 301

[[redirects]]
  from = "/casos-de-estudio/"
  to = "/casos-de-exito.html"
  status = 301

[[redirects]]
  from = "/contacto/"
  to = "/contacto.html"
  status = 301
